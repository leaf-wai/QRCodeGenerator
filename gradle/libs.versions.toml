[versions]
agp = "8.10.1"
kotlin = "1.9.24"
cameraX = "1.4.2"
permissionX = "1.8.1"
mlkitBarcode = "17.3.0"
androidxCore = "1.16.0"
appcompat = "1.7.1"
lifecycle = "2.9.1"
material = "1.12.0"
constraintLayout = "2.2.1"
zxingLite = "2.1.1"
viewBindingKtx = "1.2.4"
brvah = "3.0.4"
mmkv = "1.3.14"
gson = "2.13.1"
dialogX = "0.0.49"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
permissionx = { module = "com.guolindev.permissionx:permissionx", version.ref = "permissionX" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
zxing-lite = { module = "com.github.jenly1314:zxing-lite", version.ref = "zxingLite" }
viewbinding-ktx = { module = "com.github.DylanCaiCoding.ViewBindingKTX:viewbinding-ktx", version.ref = "viewBindingKtx" }
viewbinding-brvah = { module = "com.github.DylanCaiCoding.ViewBindingKTX:viewbinding-brvah", version.ref = "viewBindingKtx" }
brvah = { module = "com.github.CymChad:BaseRecyclerViewAdapterHelper", version.ref = "brvah" }
mmkv = { module = "com.tencent:mmkv-static", version.ref = "mmkv" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
dialogx-core = { module = "com.kongzue.dialogx:DialogX", version.ref = "dialogX" }
dialogx-miui-style = { module = "com.kongzue.dialogx.style:DialogXMIUIStyle", version.ref = "dialogX" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
