name: Android Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [[ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="${{ runner.temp }}/release-keystore.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release signing secrets are not fully configured; building unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release artifacts
        id: artifacts
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          mkdir -p dist
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            VERSION="${VERSION:-snapshot}-${GITHUB_SHA::7}"
          fi

          if [[ "$SIGNED" == "true" ]]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="QRCodeGenerator-${VERSION}.apk"
          else
            APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            APK_NAME="QRCodeGenerator-${VERSION}-unsigned.apk"
          fi

          if [[ ! -f "$APK_SRC" ]]; then
            echo "::error::Expected APK not found at $APK_SRC"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          cp "$APK_SRC" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release-keystore.jks"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRCodeGenerator-release-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
